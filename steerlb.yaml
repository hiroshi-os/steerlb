listen: ":8080"
admin: ":9901"
clusters:
  - name: api
    endpoints: ["127.0.0.1:9001", "127.0.0.1:9002", "127.0.0.1:9003", "127.0.0.1:9004", "127.0.0.1:9005"]
    picker: p2c_ewma
    health_check:
      path: /healthz
      interval: 2s
      timeout: 500ms
      healthy_threshold: 2
      unhealthy_threshold: 3
      jitter: 200ms
    outlier:
      consecutive_5xx: 5
      consecutive_gateway_failure: 3
      base_ejection_time: 5s
      max_ejection_time: 60s
      max_ejection_percent: 50
      interval: 1s
    retry:
      max_attempts: 3
      per_try_timeout: 300ms
      retry_on: [connect-failure, reset, "502", "503", "504"]
      budget_percent: 20
      min_retries_per_sec: 3
      backoff_base: 10ms
      backoff_max: 100ms
    circuit:
      max_active_requests: 1024
      max_pending: 256
routes:
  - path_prefix: /
    cluster: api
